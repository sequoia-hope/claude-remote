# Larger scrollback for long Claude sessions
set -g history-limit 50000

# Mouse support (enables touch scrolling on phone)
set -g mouse on

# Clipboard: tmux copies (mouse drag, copy-mode) are piped to the host
# desktop clipboard over SSH — GNOME Terminal/VTE ignores OSC 52, so
# set-clipboard alone never reaches it. set-clipboard stays on for
# terminals that do honour OSC 52 (and lets apps inside tmux use it).
set -g set-clipboard on
set -s copy-command "$HOME/host-copy.sh"

# Status bar with session info
set -g status-right "Claude Code | %H:%M"

# Don't destroy the tmux window when the command exits —
# keeps the session alive so you can restart Claude manually
set -g remain-on-exit on

# Slightly wider status bar for readability on small screens
set -g status-left-length 20
